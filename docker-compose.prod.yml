services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: commerce-core-backend
    restart: unless-stopped
    env_file: .env.prod
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - commerce-net

  postgres:
    image: postgres:16-alpine
    container_name: commerce-core-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - commerce-net
    # 포트 외부 노출 없음 — backend와 내부 네트워크로만 통신

  redis:
    image: redis:7-alpine
    container_name: commerce-core-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - commerce-net
    # 포트 외부 노출 없음

networks:
  commerce-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
