name: keep-warm

# 매일 아침 수동 실행 1회로 하루를 커버한다.
# GitHub 잡 하나의 최대 실행 시간은 6시간이므로, 5시간짜리 잡 2개를
# needs로 이어달려 총 ~10시간(KST 10:00~20:00)을 warm 유지한다.
# 스케줄 트리거는 누락이 잦아 제거했다.

on:
  workflow_dispatch: {}

env:
  URL: https://commerce-core-backend.onrender.com/health
  MINUTES: '300'

jobs:
  warm-1:
    runs-on: ubuntu-latest
    timeout-minutes: 310
    steps:
      - name: Keep backend warm (5h)
        run: |
          end=$((SECONDS + MINUTES * 60))
          while [ "$SECONDS" -lt "$end" ]; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" \
              --max-time 90 --retry 2 --retry-delay 10 --retry-all-errors "$URL" || echo "000")
            echo "$(date -u +%H:%M:%SZ) HTTP $code"
            sleep 300
          done

  warm-2:
    needs: warm-1
    runs-on: ubuntu-latest
    timeout-minutes: 310
    steps:
      - name: Keep backend warm (5h)
        run: |
          end=$((SECONDS + MINUTES * 60))
          while [ "$SECONDS" -lt "$end" ]; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" \
              --max-time 90 --retry 2 --retry-delay 10 --retry-all-errors "$URL" || echo "000")
            echo "$(date -u +%H:%M:%SZ) HTTP $code"
            sleep 300
          done
